services:
  # =======================================================
  # 1. ZAVERO BACKEND API (Node.js + Express + Prisma + Telegram Bot)
  # =======================================================
  - type: web
    name: zavero-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_82pkXzAtsVSy@ep-plain-hall-ayb0b1d7-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&schema=zavero_web
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TELEGRAM_BOT_TOKEN
        value: 8701521409:AAGSj1eWEk_QLIH7eMUKzxxXn5LK0ED38oY
      - key: TELEGRAM_CHAT_ID
        value: ""
      - key: CORS_ORIGIN
        value: "*"

  # =======================================================
  # 2. ZAVERO FRONTEND WEBSITE (Vite + React SPA)
  # =======================================================
  - type: web
    name: zavero-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: zavero-backend
          property: host
